plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = '1.0.4'
group = 'com.tiabfix'

base {
    archivesName = "tiab-entity-fix"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
    }
}

neoForge {
    version = "21.1.267"

    mods {
        tiabfix {
            sourceSet sourceSets.main
        }
    }
    
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    implementation files('libs/tiab.jar')
    runtimeOnly 'curse.maven:jei-238222:8932766'
    runtimeOnly 'curse.maven:applied-energistics-2-223794:9676922'
    runtimeOnly 'curse.maven:ex-pattern-provider-892005:9391213'
    runtimeOnly 'curse.maven:guideme-1173950:9366366'
    runtimeOnly 'curse.maven:glodium-957920:5821676'
    runtimeOnly files('libs/Jade-1.21.1-NeoForge-15.10.3.jar')
    compileOnly files('libs/Jade-1.21.1-NeoForge-15.10.3.jar')
    compileOnly files('libs/theoneprobe-1.21_neo-12.0.8.jar')
}

